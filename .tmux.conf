# Set prefix to Ctrl+A (like screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# Traditional vim-style pane switching (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize-panes
bind s setw synchronize-panes \; display-message "Synchronize panes: #{?synchronize-panes,ON,OFF}"

# Update all window names manually
bind u run-shell "~/.tmux/scripts/update_all_window_names.sh" \; display-message "Window names updated!"

# Also bind to a more convenient key
bind-key -n F5 run-shell "~/.tmux/scripts/update_all_window_names.sh"

# Debug key to show current pane info
bind-key d display-message "Command: #{pane_current_command} | Title: #{pane_title} | Path: #{pane_current_path}"

# Toggle pane border display (useful to see directory when nvim is running)
bind b if-shell '[ "#{pane-border-status}" = "off" ]' \
    'set pane-border-status top' \
    'set pane-border-status off'

# Completely disable automatic window renaming
set-option -g allow-rename off
set-option -g automatic-rename off
set-window-option -g automatic-rename off
set-window-option -g allow-rename off

# Set window name to directory when creating new windows/panes
set-hook -g after-new-window 'rename-window "#{b:pane_current_path}"'
set-hook -g after-split-window 'rename-window "#{b:pane_current_path}"'

# Custom status line for pane title when nvim is running - include git status
set -g pane-border-status off
set -g pane-border-format "#{?#{m:*nvim*,#{pane_current_command}}, 📝 nvim: #{pane_current_path} | #[fg=yellow]#(cd #{pane_current_path} && ~/.tmux/scripts/git_status.sh) , #{pane_current_command} | #[fg=yellow]#(cd #{pane_current_path} && ~/.tmux/scripts/git_status.sh) }"

# Increase scrollback buffer size
set -g history-limit 100000

# Move status bar to top
set-option -g status-position top

# Disable activity alerts
setw -g monitor-activity off
set -g visual-activity off

# Catppuccin theme settings
set -g @catppuccin_flavour 'mocha' # or latte, frappe, macchiato

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#{window_name}"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{window_name}"

set -g @catppuccin_status_modules_right "date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Enhanced directory display - shows full path when nvim is running, basename otherwise
set -g @catppuccin_directory_text "#{pane_current_path}"

# Date and time without seconds - update every 2 seconds for very frequent window name updates
set -g @catppuccin_date_time_text "%H:%M %Y-%m-%d"
set -g status-interval 2

# Update all window names every status interval
set-hook -g after-refresh-client 'run-shell "~/.tmux/scripts/update_all_window_names.sh"'

# Simplified Q Chat window naming - use a more direct approach
# Create a function to check if current window has q chat
set-hook -g pane-focus-in 'run-shell "
    # Check if q chat is running in current session
    if ps -ef | grep -v grep | grep -E \"(q chat|qchat)\" | grep -q \"$(tmux display-message -p \"#{session_name}\")\"; then
        tmux set-window-option automatic-rename off
        tmux set-window-option allow-rename off
        tmux rename-window \"Q CHAT\"
    else
        tmux set-window-option automatic-rename off
        tmux set-window-option allow-rename off
        tmux rename-window \"#{b:pane_current_path}\"
    fi
"'

# Add more hooks to prevent automatic renaming and ensure proper window names
set-hook -g pane-focus-in 'set-window-option automatic-rename off; set-window-option allow-rename off; rename-window "#{b:pane_current_path}"'
set-hook -g after-select-window 'set-window-option automatic-rename off; set-window-option allow-rename off; rename-window "#{b:pane_current_path}"'
set-hook -g after-select-pane 'run-shell "~/.tmux/scripts/update_all_window_names.sh"'

# Increase status bar lengths for maximum space
set -g status-left-length 20
set -g status-right-length 150

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# SESSION PERSISTENCE PLUGINS - UNCOMMENTED TO ENABLE
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Development workflow plugins
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'

# SESSION PERSISTENCE CONFIGURATION - UNCOMMENTED TO ENABLE
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'

# SessionX configuration
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override Catppuccin window formats to always show window name (must be after plugin init)
set -g window-status-format "#[fg=#cdd6f4,bg=#{@thm_surface_0}] #[fg=#cdd6f4,bg=#{@thm_surface_0}]#{window_name} #[fg=#11111b,bg=#{@thm_overlay_2}] #I "
set -g window-status-current-format "#[fg=#cdd6f4,bg=#{@thm_surface_1}] #[fg=#cdd6f4,bg=#{@thm_surface_1}]#{window_name} #[fg=#11111b,bg=#{@thm_mauve}] #I "

# Vim-aware navigation - MUST be after plugin initialization to avoid conflicts
# Configuration from alexghergh/nvim-tmux-navigation README

# decide whether we're in a Vim process - check process tree recursively for nvim
is_vim="pgrep -P #{pane_pid} | xargs -I {} pgrep -P {} nvim >/dev/null 2>&1"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
