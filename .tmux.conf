# =============================================================================
# Core
# =============================================================================

# Prefix: Ctrl+A (like GNU screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g focus-events on

# Terminal / colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",tmux-256color:RGB"
set -ga update-environment "TERM"

# Clipboard over SSH
set -g set-clipboard on
set -s set-clipboard on
set -ga terminal-overrides ',xterm*:XT:Ms=\E]52;%p1%s;%p2%s\007'

# Windows / panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 100000

# Status bar at top (interval matches continuum save interval)
set-option -g status-position top
set -g status-left-length 40
set -g status-right-length 120
set -g status-interval 15

# Activity alerts off
setw -g monitor-activity off
set -g visual-activity off

# =============================================================================
# Copy mode (vi keys — pairs with Neovim muscle memory)
# =============================================================================

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =============================================================================
# Manual key bindings (not provided by plugins)
# =============================================================================

# Quick window switching (Meta+number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Re-apply theme for current terminal appearance (pairs with :ThemeSync in nvim)
bind T if-shell '[ "#{client_theme}" = "light" ]' \
    'source-file ~/.config/theme/generated/tmux-light.conf' \
    'source-file ~/.config/theme/generated/tmux-dark.conf'

# Toggle synchronize-panes
bind s setw synchronize-panes \; display-message "Synchronize panes: #{?synchronize-panes,ON,OFF}"

# Debug: show pane info
bind-key d display-message "Command: #{pane_current_command} | Title: #{pane_title} | Path: #{pane_current_path}"

# Toggle pane border (useful when nvim is running)
bind b if-shell '[ "#{pane-border-status}" = "off" ]' \
    'set pane-border-status top' \
    'set pane-border-status off'

# Session persistence controls (tmux-resurrect + tmux-continuum)
# Default: auto-restore on tmux server start (@continuum-restore 'on')
# Resurrect defaults: prefix+Ctrl-s save | prefix+Ctrl-r restore now
# Skip auto-restore on NEXT tmux start (official continuum method):
bind-key X confirm-before -p "Skip auto-restore on next tmux start? [y/N]" \
    'run-shell "touch \"${HOME}/tmux_no_auto_restore\" && tmux display-message \"Next start: no auto-restore (rm ~/tmux_no_auto_restore to undo)\""'
# Re-enable auto-restore for next start:
bind-key ^X run-shell 'rm -f "${HOME}/tmux_no_auto_restore" && tmux display-message "Auto-restore enabled for next tmux start"'

# =============================================================================
# Window naming — native tmux (instant; no Python/tmux-window-name)
# =============================================================================

set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format '#{?#{==:#{pane_current_command},nvim},nvim:#{b:pane_current_path},#{?#{==:#{pane_current_command},ssh},ssh:#{b:pane_current_path},#{b:pane_current_path}}}'

# =============================================================================
# Pane borders — path + command (git on status bar; toggle with prefix+b)
# =============================================================================

set -g pane-border-status off
set -g pane-border-format "#{?#{m:*nvim*,#{pane_current_command}},#[fg=green]nvim#[default] #{pane_current_path},#{pane_current_command} | #{pane_current_path}}"

# =============================================================================
# Theme — auto light/dark via central manifest (~/.config/theme/manifest.toml)
# dark-notify watches macOS appearance and reloads generated theme files.
set-hook -g client-dark-theme 'source-file ~/.config/theme/generated/tmux-dark.conf'
set-hook -g client-light-theme 'source-file ~/.config/theme/generated/tmux-light.conf'

set -g @plugin 'ivuorinen/tmux-dark-notify'
set -g @dark-notify-theme-path-light '$HOME/.config/theme/generated/tmux-light.conf'
set -g @dark-notify-theme-path-dark '$HOME/.config/theme/generated/tmux-dark.conf'

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #{window_name}'
set -g @catppuccin_window_current_text ' #{window_name}'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_middle_separator ''
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'yes'

# =============================================================================
# Plugins (TPM) — order matters for conflicting key bindings; see bottom section
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'pschmitt/tmux-pain-control'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Nucc/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- tmux-resurrect (required by continuum) ---
# Saves live under XDG_DATA_HOME (not ~/.tmux/resurrect) unless that dir exists.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
# nvim uses 'default' strategy — rmagatti/auto-session restores buffers when nvim respawns
set -g @resurrect-strategy-nvim 'default'
set -g @resurrect-strategy-vim 'default'
set -g @resurrect-processes 'ssh mosh-client "~ssh->ssh *"'
# Pane scrollback capture breaks when session names contain '/' (e.g. bugfix/DAS-27635).
set -g @resurrect-capture-pane-contents 'off'

# --- tmux-continuum (must be last plugin — hooks status-right for auto-save) ---
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Allow slow plugin loads (many TPM plugins) before continuum's built-in restore window.
set -g @continuum-restore-max-delay '30'

# Startup race guard: continuum skips restore + save-delay when multiple tmux clients
# attach at once (common after a crash when Ghostty restores tabs). Set timestamp
# before TPM so auto-save cannot overwrite resurrect's "last" before restore runs.
run-shell 'tmux set -gq @continuum-save-last-timestamp $(date +%s)'

# --- tmux-sessionx ---
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

# --- tmux-pain-control (pschmitt fork) ---
# Disable keys that conflict with vim-tmux-navigator (prefix-less C-h/j/k/l)
# and tmux-ssh-split (| and -). See PLUGIN REFERENCE at bottom of file.
set -g @disabled_keys "C-h,C-j,C-k,C-l,|,-"

# --- tmux-ssh-split ---
set -g @ssh-split-h-key "|"
set -g @ssh-split-v-key "-"
set -g @ssh-split-keep-cwd "true"
set -g @ssh-split-keep-remote-cwd "true"
set -g @ssh-split-strip-cmd "true"
set -g @ssh-split-no-shell "false"

# --- tmux-fzf ---
set -g @tmux-fzf-launch-key 'F'

# --- tmux-which-key (LazyVim-style discoverable keybinding menu) ---
set -g @which-key-trigger 'Space'
set -g @which-key-popup-height '20'
set -g @which-key-popup-width '110'

# Clear legacy hooks from the old ~/.tmux/scripts/ config. source-file does NOT
# remove hooks set by a previous config — they persist until cleared or kill-server.
set-hook -gu after-new-window
set-hook -gu after-split-window
set-hook -gu after-select-window
set-hook -gu after-select-pane
set-hook -gu after-refresh-client
set-hook -gu after-rename-window
set-hook -gu pane-focus-in
set-hook -gu client-focus-in

# Initialize TPM (must stay above post-plugin overrides, below plugin list)
run '~/.tmux/plugins/tpm/tpm'

# tmux-dark-notify — TPM sources *.tmux (breaks $0); launch daemon explicitly
run-shell 'bash ~/.tmux/plugins/tmux-dark-notify/main.tmux'

# =============================================================================
# Post-plugin overrides
# =============================================================================

# Status bar — after TPM; re-sourced by theme generated conf on theme change
source-file ~/.config/tmux/post-theme.conf

# Apply theme on load — dark-notify symlink when daemon is running, else client_theme fallback
if-shell 'test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf' \
    'source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf'
if-shell 'test ! -e ~/.local/state/tmux/tmux-dark-notify-theme.conf' \
    'if-shell "[ \"#{client_theme}\" = \"light\" ]" \
        "source-file ~/.config/theme/generated/tmux-light.conf" \
        "source-file ~/.config/theme/generated/tmux-dark.conf"'

# Keybinding help — prefix+? fuzzy-searches all tmux bindings (tmux-fzf)
bind-key ? run-shell '~/.tmux/plugins/tmux-fzf/scripts/keybinding.sh'

# =============================================================================
# Neovim integration — MUST stay after TPM/plugin init
# =============================================================================
# Uses christoomey/vim-tmux-navigator on the tmux side and
# alexghergh/nvim-tmux-navigation on the Neovim side (already in your nvim config).
#
# IMPORTANT: Do NOT re-enable pain-control's prefix-less C-h/j/k/l bindings
# (@disabled_keys above). They bypass Neovim and break seamless navigation.
#
# C-l: always forward to the pane (shell clear-screen). Neovim catches it via
# nvim-tmux-navigation when nvim is focused.
bind-key -n 'C-l' send-keys C-l

# C-Space: cycle panes (not in vim-tmux-navigator TPM plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

# Copy-mode: keep vim-style pane navigation while scrolling
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Reliable session restore on server start (after-server-started hook unavailable in
# tmux next-3.7). Continuum skips restore when multiple clients attach at once;
# this runs once per server via @jose-startup-restore-done after plugins load.
run-shell 'bash -c "tmux show -gqv @jose-startup-restore-done 2>/dev/null | grep -q 1 && exit 0; start=\$(tmux display-message -p -F \"#{start_time}\"); now=\$(date +%s); delay=\$(tmux show -gqv @continuum-restore-max-delay 2>/dev/null); delay=\${delay:-30}; [ -n \"\$start\" ] && [ \"\$start\" -gt \$((now-delay)) ] || exit 0; [ -f \"\${HOME}/tmux_no_auto_restore\" ] && exit 0; L=\"\${XDG_DATA_HOME:-\${HOME}/.local/share}/tmux/resurrect/last\"; [ -e \"\$L\" ] || exit 0; tmux set -gq @jose-startup-restore-done 1; sleep 3; \"\${HOME}/.tmux/plugins/tmux-resurrect/scripts/restore.sh\" quiet >/dev/null 2>&1 &"'

# =============================================================================
# PLUGIN REFERENCE — review, try, or remove
# =============================================================================
#
# Install / update all plugins:  prefix + I
# Remove a plugin: delete its @plugin line + prefix + alt+u, then reload
#
# ---------------------------------------------------------------------------
# pschmitt/tmux-ssh-split
# ---------------------------------------------------------------------------
# WHAT: Splits panes using your current working directory. If the pane is in an
#       SSH session, opens a new SSH connection to the same host (not a shared
#       session). When you exit SSH, you land in the local directory you were in
#       before connecting (@ssh-split-no-shell "false").
# USE:  prefix + |  horizontal split
#       prefix + -  vertical split
# DROP: Remove @plugin line and @ssh-split-* options; restore manual binds:
#         bind | split-window -h -c '#{pane_current_path}'
#         bind - split-window -v -c '#{pane_current_path}'
#
# ---------------------------------------------------------------------------
# pschmitt/tmux-pain-control (fork — supports @disabled_keys)
# ---------------------------------------------------------------------------
# WHAT: Vim-style pane navigation (prefix+h/j/k/l), resize (prefix+Shift+H/J/K/L),
#       window swap (prefix+< / >), new window in current dir (prefix+c).
# USE:  prefix + h/j/k/l       move between panes
#       prefix + Shift+H/J/K/L resize panes
#       prefix + < / >         move window left/right
#       prefix + c             new window in current directory
# NOTE: C-h/j/k/l WITHOUT prefix are disabled here on purpose — they clash with
#       Neovim when vim-tmux-navigator is active. Keep @disabled_keys as set.
# DROP: Remove @plugin line; re-add manual h/j/k/l/H/J/K/L binds if needed.
#
# ---------------------------------------------------------------------------
# christoomey/vim-tmux-navigator
# ---------------------------------------------------------------------------
# WHAT: Seamless Ctrl+h/j/k/\\ navigation between Neovim splits and tmux panes.
#       Requires matching Neovim plugin (you already use nvim-tmux-navigation).
# USE:  Ctrl+h/j/k/\\  navigate (no prefix) — works in shell and Neovim
# NOTE: C-l is overridden above to always clear the shell screen; Neovim still
#       receives C-l via send-keys and nvim-tmux-navigation handles it.
#       Requires Neovim config — see TMUX_UPDATE.md (not applied automatically).
# DROP: Remove @plugin line AND remove nvim-tmux-navigation from Neovim config.
#
# ---------------------------------------------------------------------------
# Window naming (native tmux)
# ---------------------------------------------------------------------------
# WHAT: Automatic window names from pane cwd / program (nvim:, ssh:, or basename).
#       Replaced tmux-window-name for instant window switches (no Python).
# NOTE: No josev-/domain stripping or Q Chat rules — those required tmux-window-name.
#
# ---------------------------------------------------------------------------
# Nucc/tmux-which-key
# ---------------------------------------------------------------------------
# WHAT: LazyVim/which-key.nvim-style popup menu for discoverable tmux shortcuts.
#       Nested groups (pane, window, session, git, layout, etc.) with breadcrumbs.
# USE:  prefix + Space  open which-key menu (press a key to act or drill into group)
#       Esc / Backspace  go back or close
#       Inside menu, ?    list all tmux keybindings (native scroll view)
# NOTE: Does NOT use prefix-less C-Space — that stays reserved for pane cycling
#       and Neovim (see Neovim integration section above).
# NEEDS: jq (macOS includes /usr/bin/jq; brew install jq if missing)
# DROP: Remove @plugin line and @which-key-* options.
#
# ---------------------------------------------------------------------------
# sainnhe/tmux-fzf
# ---------------------------------------------------------------------------
# WHAT: Fuzzy finder for sessions, windows, panes, commands, keybindings, etc.
# USE:  prefix + F      open tmux-fzf action menu
#       prefix + ?      fuzzy-search ALL key bindings and execute (post-plugin bind)
# DROP: Remove @plugin line, @tmux-fzf-launch-key, and the bind-key ? line above.
#
# ---------------------------------------------------------------------------
# Existing plugins (unchanged behavior)
# ---------------------------------------------------------------------------
# tmux-sensible     — sane defaults (keep)
# tmux-yank         — copy to system clipboard in vi copy mode (keep)
# tmux-continuum    — auto-save/restore every 15 min + on tmux server start (keep)
# tmux-resurrect    — saves layout, cwd, ssh, nvim panes (required by continuum)
# tmux-sessionx     — prefix+o fuzzy session switcher (keep)
# tmux-fzf-url      — open URLs from tmux copy buffer (keep)
# tmux-logging      — prefix+Shift+P toggle pipe-pane logging (keep)
# tmux-copycat      — prefix+/ incremental search in buffer (keep)
# tmux-open         — prefix+o open files/URLs from copy mode (keep; may share
#                     prefix+o with sessionx — sessionx wins via its bind)
# catppuccin/tmux   — theme (keep)
#
# ---------------------------------------------------------------------------
# gitmux (Homebrew binary — not a TPM plugin)
# ---------------------------------------------------------------------------
# WHAT: Git branch/status for the active pane on the status bar (one git call).
# USE:  Visible on status-right when in a repo; pane borders show path only.
# INSTALL: brew install gitmux
# CONFIG:  ~/.gitmux.conf (catppuccin colors; branch + dirty flags)
# DROP: Remove #{E:@catppuccin_status_gitmux} from status-right above.
#
# ---------------------------------------------------------------------------
# tmux-resurrect + tmux-continuum (session persistence)
# ---------------------------------------------------------------------------
# WHAT: Saves all sessions/windows/panes/cwd every 15 min; restores on tmux
#       server start (after reboot or kill-server). SSH panes re-run ssh command;
#       nvim panes respawn nvim in saved cwd — auto-session restores buffers.
#       Pane scrollback capture is off (session names with '/' break resurrect paths).
# USE:  prefix + Ctrl-s   save tmux env now
#       prefix + Ctrl-r   restore tmux env now (manual)
#       prefix + X        skip auto-restore on NEXT tmux start (confirm)
#       prefix + Ctrl-x   re-enable auto-restore for next start
# SKIP: touch ~/tmux_no_auto_restore  (official continuum opt-out file)
# NOTE: Auto-restore runs only on tmux SERVER start, not on source-file.
#       After laptop reboot: open tmux (or attach) — layout restores automatically.
# DROP: Remove resurrect/continuum @plugin lines and @resurrect-* / @continuum-* opts.
