git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --syntax-theme=none --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  commit:
    signOff: false
  autoFetch: true
  autoRefresh: true
  log:
    order: "topo-order"
  gitLogTimezone: "UTC"
# Edit: ~/.config/lazygit/bin/edit-from-nvim.sh (parent nvim when reachable, else standalone nvim)
os:
  edit: "$HOME/.config/lazygit/bin/edit-from-nvim.sh {{filename}}"
  editAtLine: "$HOME/.config/lazygit/bin/edit-from-nvim.sh {{filename}} {{line}}"
  editInTerminal: true
gui:
  sidePanelWidth: 0.3333
  mainPanelSplitMode: 'flexible'
  expandFocusedSidePanel: true
refresher:
  refreshInterval: 10
confirmOnQuit: false
quitOnTopLevelReturn: true
keybinding:
  universal:
    # Vim-style scroll for the diff/patch pane (j/k move selection, these scroll content)
    scrollUpMain: "<c-y>"
    scrollDownMain: "<c-e>"
    scrollUpMain-alt1: "K"
    scrollDownMain-alt1: "J"
    scrollUpMain-alt2: "<ctrl+u>"
    scrollDownMain-alt2: "<ctrl+d>"
