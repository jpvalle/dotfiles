git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --syntax-theme=none --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  commit:
    signOff: false
  autoFetch: true
  autoRefresh: true
  log:
    order: "topo-order"
  gitLogTimezone: "UTC"
os:
  # Open files in the parent Neovim session (uses $NVIM_LISTEN_ADDRESS set per-session)
  edit: 'nvr --remote-tab {{filename}}'
  editAtLine: 'nvr +{{line}} --remote-tab {{filename}}'
  editInTerminal: false
gui:
  sidePanelWidth: 0.3333
  mainPanelSplitMode: 'flexible'
  expandFocusedSidePanel: true
refresher:
  refreshInterval: 10
confirmOnQuit: false
quitOnTopLevelReturn: true
