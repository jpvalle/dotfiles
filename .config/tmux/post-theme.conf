# Status bar segments — source after catppuccin loads (from .tmux.conf and theme files)
# Rounded  caps use reverse fg against status bar bg (plain fg=text_bg is invisible).
set -gF @_ctp_rounded_right_cap '#[fg=#{@_ctp_status_bg},reverse]#[none]'

# Gitmux output resets bg=default at the end — rebuild module so padding +  cap survive.
# Use set -g (not -gF): #{E:@catppuccin_gitmux_text} must stay dynamic for #(gitmux …).
set -g @catppuccin_status_gitmux \
  "#[fg=#{@catppuccin_status_gitmux_icon_bg}]#{@catppuccin_status_left_separator}#[fg=#{@catppuccin_status_gitmux_icon_fg},bg=#{@catppuccin_status_gitmux_icon_bg}]#{@catppuccin_gitmux_icon}#{@catppuccin_status_middle_separator}#[fg=#{@catppuccin_status_gitmux_text_fg},bg=#{E:@catppuccin_status_module_text_bg}]#{E:@catppuccin_gitmux_text}#[fg=#{E:@catppuccin_status_module_text_bg},bg=#{E:@catppuccin_status_module_text_bg}] #{E:@_ctp_rounded_right_cap}"

# One status-bar gap between window list and left/right segments (matches inter-window spacing).
set -g status-left "#{E:@catppuccin_status_session}#{E:@_ctp_rounded_right_cap}#[bg=#{@_ctp_status_bg}] "
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?synchronize-panes,#[fg=#{@thm_red},bold] SYNC ,}#[bg=#{@_ctp_status_bg}] #{E:@catppuccin_status_gitmux}#{E:@catppuccin_status_application}#{E:@_ctp_rounded_right_cap}"
