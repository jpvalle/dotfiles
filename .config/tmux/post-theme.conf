# Status bar segments — source after catppuccin loads (from .tmux.conf and theme files)
# Rounded  caps use reverse fg against status bar bg (plain fg=text_bg is invisible).
set -gF @_ctp_rounded_right_cap '#[fg=#{@_ctp_status_bg},reverse]#[none]'

# One status-bar gap between window list and left/right segments (matches inter-window spacing).
set -g status-left "#{E:@catppuccin_status_session}#{E:@_ctp_rounded_right_cap}#[bg=#{@_ctp_status_bg}] "
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?synchronize-panes,#[fg=#{@thm_red},bold] SYNC ,}#[bg=#{@_ctp_status_bg}] #{E:@catppuccin_status_application}#{E:@_ctp_rounded_right_cap}"
