# Unset cached status modules — not cleared by @catppuccin_reset in catppuccin/tmux v2.3.0
set -Ugu @catppuccin_status_session
set -Ugu @catppuccin_status_gitmux
set -Ugu @catppuccin_status_application
set -Ugu @catppuccin_session_color
set -Ugu @catppuccin_gitmux_color
set -Ugu @catppuccin_application_color
set -Ugu @catppuccin_status_session_icon_fg
set -Ugu @catppuccin_status_session_icon_bg
set -Ugu @catppuccin_status_session_text_fg
set -Ugu @catppuccin_status_session_text_bg
set -Ugu @catppuccin_status_gitmux_icon_fg
set -Ugu @catppuccin_status_gitmux_icon_bg
set -Ugu @catppuccin_status_gitmux_text_fg
set -Ugu @catppuccin_status_gitmux_text_bg
set -Ugu @catppuccin_status_application_icon_fg
set -Ugu @catppuccin_status_application_icon_bg
set -Ugu @catppuccin_status_application_text_fg
set -Ugu @catppuccin_status_application_text_bg
set -Ugu @_ctp_status_bg
# Window separators use set -gq in catppuccin_tmux.conf — stale "basic" caps block rounded style
set -Ugu @catppuccin_window_left_separator
set -Ugu @catppuccin_window_middle_separator
set -Ugu @catppuccin_window_right_separator
set -Ugu @catppuccin_window_current_left_separator
set -Ugu @catppuccin_window_current_middle_separator
set -Ugu @catppuccin_window_current_right_separator
