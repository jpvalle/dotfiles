# Light theme — tmux client-light-theme hook + manual sync (prefix+T)
set -g @catppuccin_flavor 'latte'
set -g @catppuccin_reset true
source-file ~/.config/tmux/catppuccin-clear-modules.conf
run '~/.tmux/plugins/tmux/catppuccin.tmux'
source-file ~/.config/tmux/catppuccin-overrides.conf
# Second run required after reset + overrides (%if blocks evaluate at source time)
run '~/.tmux/plugins/tmux/catppuccin.tmux'
source-file ~/.config/tmux/post-theme.conf
