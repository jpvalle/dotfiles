# Dracula — dark
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-style "bg=#282a36,fg=#bd93f9,bold"
set -g status-right-style "bg=#282a36,fg=#6272a4"
set -g window-status-style "bg=#282a36,fg=#6272a4"
set -g window-status-current-style "bg=#44475a,fg=#8be9fd,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left " 󰖲 "
set -g status-right " #S %H:%M "
