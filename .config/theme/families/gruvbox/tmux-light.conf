# Gruvbox — light
set -g status-style "bg=#fbf1c7,fg=#3c3836"
set -g status-left-style "bg=#fbf1c7,fg=#b57614,bold"
set -g status-right-style "bg=#fbf1c7,fg=#928374"
set -g window-status-style "bg=#fbf1c7,fg=#928374"
set -g window-status-current-style "bg=#ebdbb2,fg=#af3a03,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left " 󰖲 "
set -g status-right " #S %H:%M "
