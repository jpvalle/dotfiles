# Central theme configuration
#
# Switch themes:
#   1. Set `family` below to the theme name (e.g. family = "tokyonight")
#   2. Run `theme-sync` (or open a new shell / :ThemeSync in nvim)
#
# Only one [families.*] block should be active at a time in practice — the block
# matching `family` must exist uncommented. Other families stay commented as templates.
#
# mode:
#   system — follow macOS light/dark (Linux defaults to dark)
#   dark   — force dark variant
#   light  — force light variant

family = "catppuccin"
mode = "system"

# =============================================================================
# ACTIVE — Catppuccin
# =============================================================================

[families.catppuccin]
tmux_style = "catppuccin"
p10k_style = "catppuccin"
ghostty = { dark = "Catppuccin Mocha", light = "Catppuccin Latte" }
nvim = { dark = "catppuccin-mocha", light = "catppuccin-latte" }
nvim_background = { dark = "dark", light = "light" }
tmux = { dark = "mocha", light = "latte" }
bat = { dark = "Catppuccin Mocha", light = "Catppuccin Latte" }
p10k = { dark = "mocha", light = "latte" }
delta = { dark = "catppuccin-mocha", light = "catppuccin-latte" }
lazygit = { dark = "mocha", light = "latte" }
wezterm = { dark = "Catppuccin Mocha", light = "Catppuccin Latte" }

